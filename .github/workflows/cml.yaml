name: CML Report
on: push

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: iterative/setup-cml@v2
      - uses: iterative/setup-dvc@v1
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Install JSON5
        run: npm install -g json5

      # If you keep client id/secret in repo's .dvc/config.local, you can DROP this step.
      # If you saved them as secrets, uncomment the two lines below to inject them at runtime.
      - name: Configure DVC remote (optional)
        run: |
          dvc remote modify --local storage gdrive_client_id "${{ secrets.GDRIVE_CLIENT_ID }}"
          dvc remote modify --local storage gdrive_client_secret "${{ secrets.GDRIVE_CLIENT_SECRET }}"
        if: ${{ secrets.GDRIVE_CLIENT_ID != '' && secrets.GDRIVE_CLIENT_SECRET != '' }}

      - name: Pull DVC data
        env:
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
        run: dvc pull

      - name: Generate metrics report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install -r src/requirements.txt
          dvc repro 

          git fetch --prune
          dvc metrics diff --show-md main > report.md

          # Add figure to the report
          echo "## Validating results by region" >> report.md
          cml-publish eval/plots/images/importance.png --md >> report.md
          cml-send-comment report.md

name: CML Report
on: push
jobs:
  run:
    runs-on: [ubuntu-latest]
    steps:
      - uses: iterative/setup-cml@v2
      - uses: iterative/setup-dvc@v1
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2

      # Install JSON5
      - name: Install JSON5
        run: npm install -g json5

      # Pull data tracked by DVC
      - name: Pull DVC data
        env:
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}  # or your remote creds
        run: dvc pull

      - name: Generate metrics report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install -r src/requirements.txt
          dvc repro 

          git fetch --prune
          dvc metrics diff --show-md main > report.md

          echo "## Validating results by region" >> report.md
          cml-publish eval/plots/images/importance.png --md >> report.md
          cml-send-comment report.md
